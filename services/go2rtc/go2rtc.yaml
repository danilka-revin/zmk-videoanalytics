# ZMK Vision go2rtc baseline — VLC-like real-time streaming.
#
# go2rtc is exposed on the host network so WebRTC can advertise a real LAN/IPv4
# candidate to the browser. The Web panel proxies HTTP API and WebSocket
# signaling through nginx under /rtc/ to keep the browser same-origin.
# This config is tuned for low latency like VLC: TCP transport, minimal
# jitter, direct H264/H265 passthrough without transcoding.
log:
  format: text
  level: info

api:
  listen: ":1984"
  base_path: "/rtc"
  origin: "*"

rtsp:
  listen: ":8554"
  # Low-latency defaults: use TCP, small delays, like VLC's live555
  default_query: ""

webrtc:
  listen: ":8555"
  # VLC-like: advertise host candidates, allow UDP+TCP, use public STUN
  candidates:
    - stun:8555
  filters:
    loopback: true
    networks: [udp4, tcp4]
  ice_servers:
    - urls: [stun:stun.google.com:3478, stun:stun.l.google.com:19302, stun:stun1.l.google.com:19302]

# Camera RTSP sources are managed by the ZMK API through
# PUT /rtc/api/streams?name=zmk-<camera_id>&src=rtsp://...#transport=tcp
# API also creates legacy plain <camera_id> alias so frontend requesting
# either name always finds a stream and shows real-time video, not slideshow.
streams: {}
