# ZMK Vision go2rtc baseline.
#
# go2rtc is exposed on the host network so WebRTC can advertise a real LAN/IPv4
# candidate to the browser. The Web panel proxies HTTP API and WebSocket
# signaling through nginx under /rtc/ to keep the browser same-origin.
log:
  format: text
  level: info

api:
  listen: ":1984"
  base_path: "/rtc"
  origin: "*"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"
  filters:
    loopback: true
    networks: [udp4, tcp4]
  ice_servers:
    - urls: [stun:stun.google.com:3478, stun:stun.l.google.com:19302]

# Camera RTSP sources are managed by the ZMK API through
# PUT /rtc/api/streams?name=zmk-<camera_id>&src=...
streams: {}
