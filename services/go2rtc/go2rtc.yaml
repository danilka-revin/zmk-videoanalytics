# ZMK Vision go2rtc v2.15.0 — ROBUST SINGLE CONNECTION + BLACK SCREEN FIX
#
# Architecture: go2rtc is the ONLY RTSP client to camera.
# - API creates streams zmk-{id} and {id} via PUT /rtc/api/streams
# - go2rtc pulls from camera via RTSP TCP (single connection, true FPS like VLC)
# - Inference worker pulls from go2rtc RTSP rtsp://host.docker.internal:8554/zmk-{id}
# - Frontend: WebRTC H264 direct (25-60 FPS) -> MSE fMP4 over WS -> HLS -> JPEG polling -> MJPEG
#
# Fixes v2.15.0:
# - Black screen: add host candidates, TCP fallback, frontend JPEG polling transport
# - 4 FPS: ensure low-latency, no buffering, direct H264 passthrough
# - Reconnects: single conn, go2rtc handles reconnect, inference never double-connects

log:
  format: text
  level: info

api:
  listen: ":1984"
  base_path: "/rtc"
  origin: "*"

rtsp:
  listen: ":8554"
  # mp4 = H264/H265/AAC passthrough for MSE/HLS low-latency, no transcoding
  default_query: "mp4"

webrtc:
  listen: ":8555"
  # Robust candidates: STUN for public IP + host network IPs + TCP fallback
  # Host network mode means go2rtc sees real LAN IPs and can advertise them
  candidates:
    - stun:8555
    - 127.0.0.1:8555
    - tcp:8555
  ice_servers:
    - urls: [stun:stun.l.google.com:19302, stun:stun1.l.google.com:19302, stun:stun2.l.google.com:19302, stun:stun.cloudflare.com:3478]

# Camera RTSP sources managed by ZMK API via PUT /rtc/api/streams?name=zmk-{id}&src=rtsp://...#transport=tcp
# go2rtc keeps single RTSP connection to camera and fans out to all consumers
streams: {}
