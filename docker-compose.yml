services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    restart: unless-stopped
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"], interval: 15s, timeout: 3s, retries: 3}
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    depends_on: [api]
  telegram-bot:
    build: ./services/telegram_bot
    profiles: ["telegram"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_OPERATOR_IDS: ${TELEGRAM_OPERATOR_IDS:-}
      TELEGRAM_VIEWER_IDS: ${TELEGRAM_VIEWER_IDS:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-http://localhost:5173/telegram}
      ZMK_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    profiles: ["production"]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    profiles: ["production"]
    environment: {POSTGRES_DB: videoanalytics, POSTGRES_USER: zmk, POSTGRES_PASSWORD: change-me}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  minio:
    image: minio/minio
    profiles: ["production"]
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: zmkadmin, MINIO_ROOT_PASSWORD: change-me-now}
    volumes: ["minio-data:/data"]
volumes: {postgres-data: {}, minio-data: {}}
