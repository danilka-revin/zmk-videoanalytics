services:
  api:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/app/data"]
    environment:
      VIDEOANALYTICS_DB: /app/data/videoanalytics.db
      ZMK_API_KEY: ${ZMK_API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RTSP_CAM_01: ${RTSP_CAM_01:-rtsp://camera-01/stream}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_OPERATOR_IDS: ${TELEGRAM_OPERATOR_IDS:-}
      TELEGRAM_VIEWER_IDS: ${TELEGRAM_VIEWER_IDS:-}
    restart: unless-stopped
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"], interval: 15s, timeout: 3s, retries: 3}
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  telegram-bot:
    build: ./services/telegram_bot
    profiles: ["telegram"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_OPERATOR_IDS: ${TELEGRAM_OPERATOR_IDS:-}
      TELEGRAM_VIEWER_IDS: ${TELEGRAM_VIEWER_IDS:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-http://localhost:5173/telegram}
      ZMK_API_URL: http://api:8000
      ZMK_API_KEY: ${ZMK_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    profiles: ["production"]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    profiles: ["production"]
    environment: {POSTGRES_DB: videoanalytics, POSTGRES_USER: zmk, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-before-production}"}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  minio:
    image: minio/minio
    profiles: ["production"]
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: "${MINIO_ROOT_USER:-zmkadmin}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-change-before-production}"}
    volumes: ["minio-data:/data"]
volumes: {postgres-data: {}, minio-data: {}}
