services:
  api:
    build: ./backend
    ports:
    - 127.0.0.1:8000:8000
    volumes:
    - ./data:/app/data
    - dataset-data:/datasets
    - model-data:/models
    # Dedicated secret volume: bot workers must not get a read-only mount of
    # the database/RTSP data just to receive their token.
    - bot-token-data:/bot-tokens
    environment:
      VIDEOANALYTICS_DB: /app/data/videoanalytics.db
      DATASET_DIR: /datasets
      MODEL_DIR: /models
      ZMK_API_KEY: ${ZMK_API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      # Upgrade legacy 20 FPS camera limits unless explicitly disabled.
      CAMERA_HIGH_FPS_MODE: ${CAMERA_HIGH_FPS_MODE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MESSENGER_PROVIDER: ${MESSENGER_PROVIDER:-none}
      # Training worker is part of the default stack and remains available in
      # CPU mode when NVIDIA is absent; docker-compose.gpu.yml adds GPUs.
      TRAINING_WORKER_URL: ${TRAINING_WORKER_URL:-http://training-worker:8010}
      ZMK_WORKER_TOKEN: ${ZMK_WORKER_TOKEN:-}
      ZMK_WORKER_TOKEN_FILE: ${ZMK_WORKER_TOKEN_FILE:-/models/.worker-token}
      # Write-only tokens entered in Admin → Боты. This dedicated volume is
      # mounted read-only into messenger workers and never exposed by an API response.
      ZMK_BOT_TOKEN_DIR: /bot-tokens
      UPDATE_SERVICE_URL: ${UPDATE_SERVICE_URL:-http://updater:8020}
      ZMK_UPDATE_TOKEN: ${ZMK_UPDATE_TOKEN:-}
      # Optional first-camera bootstrap; keep empty when configuring cameras in UI.
      RTSP_CAM_01: ${RTSP_CAM_01:-}
      # Optional .env fallbacks. Tokens entered in Admin → Боты are stored
      # outside SQLite in the dedicated bot-token volume and take precedence.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_OPERATOR_IDS: ${TELEGRAM_OPERATOR_IDS:-}
      TELEGRAM_VIEWER_IDS: ${TELEGRAM_VIEWER_IDS:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-http://localhost:5173/telegram}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_ADMIN_IDS: ${MAX_ADMIN_IDS:-}
      MAX_OPERATOR_IDS: ${MAX_OPERATOR_IDS:-}
      MAX_VIEWER_IDS: ${MAX_VIEWER_IDS:-}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 15s
      timeout: 3s
      retries: 3
  web:
    build: ./frontend
    ports:
    - 5173:80
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  telegram-bot:
    build: ./services/telegram_bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_OPERATOR_IDS: ${TELEGRAM_OPERATOR_IDS:-}
      TELEGRAM_VIEWER_IDS: ${TELEGRAM_VIEWER_IDS:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-http://localhost:5173/telegram}
      # The API writes Admin-entered tokens here atomically; bots can only read.
      ZMK_BOT_TOKEN_DIR: /bot-secrets
      ZMK_API_URL: http://api:8000
      ZMK_API_KEY: ${ZMK_API_KEY:-}
    volumes:
    - bot-token-data:/bot-secrets:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  max-bot:
    build: ./services/max_bot
    environment:
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_ADMIN_IDS: ${MAX_ADMIN_IDS:-}
      MAX_OPERATOR_IDS: ${MAX_OPERATOR_IDS:-}
      MAX_VIEWER_IDS: ${MAX_VIEWER_IDS:-}
      # Same dedicated private read-only volume as telegram-bot.
      ZMK_BOT_TOKEN_DIR: /bot-secrets
      ZMK_API_URL: http://api:8000
      ZMK_API_KEY: ${ZMK_API_KEY:-}
    volumes:
    - bot-token-data:/bot-secrets:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  inference-worker:
    build: ./services/inference_worker
    profiles:
    - inference
    environment:
      ZMK_API_URL: http://api:8000
      ZMK_API_KEY: ${ZMK_API_KEY:-}
      ZMK_WORKER_TOKEN: ${ZMK_WORKER_TOKEN:-}
      # Keep this in sync with API so a custom shared-token path works too.
      ZMK_WORKER_TOKEN_FILE: ${ZMK_WORKER_TOKEN_FILE:-/models/.worker-token}
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-auto}
      INFERENCE_CONF: ${INFERENCE_CONF:-0.5}
      # ffmpeg is resilient to damaged RTP/H.264 streams; set opencv only for
      # troubleshooting a known-good local camera.
      CAMERA_DECODER: ${CAMERA_DECODER:-ffmpeg}
      # Forward every RTSP knob declared in .env. Previously these values
      # were documented but never reached the worker container.
      RTSP_TRANSPORT: ${RTSP_TRANSPORT:-auto}
      RTSP_BUFFER_SIZE: ${RTSP_BUFFER_SIZE:-}
      RTSP_STIMEOUT: ${RTSP_STIMEOUT:-5000000}
      RTSP_TIMEOUT_OPTION: ${RTSP_TIMEOUT_OPTION:-timeout}
      RTSP_OPEN_TIMEOUT_MS: ${RTSP_OPEN_TIMEOUT_MS:-8000}
      RTSP_READ_TIMEOUT_MS: ${RTSP_READ_TIMEOUT_MS:-8000}
      RTSP_KEYFRAME_GRACE_SECONDS: ${RTSP_KEYFRAME_GRACE_SECONDS:-15}
      # Keep only a small RTP jitter buffer for near-live MJPEG preview.
      RTSP_MAX_DELAY_US: ${RTSP_MAX_DELAY_US:-100000}
      OFFLINE_AFTER_FRAMES: ${OFFLINE_AFTER_FRAMES:-3}
      RTSP_RECONNECT_SECONDS: ${RTSP_RECONNECT_SECONDS:-5}
      CAMERA_CONTROL_POLL_SECONDS: ${CAMERA_CONTROL_POLL_SECONDS:-2}
      CAMERA_TELEMETRY_SECONDS: ${CAMERA_TELEMETRY_SECONDS:-5}
      CAMERA_SNAPSHOT_SECONDS: ${CAMERA_SNAPSHOT_SECONDS:-3}
      # Actual MJPEG preview rate sent to the browser (source-limited, up to 60 FPS).
      CAMERA_LIVE_FPS: ${CAMERA_LIVE_FPS:-60}
      # AI is sampled separately so model speed does not throttle the preview.
      CAMERA_INFERENCE_FPS: ${CAMERA_INFERENCE_FPS:-8}
      CAMERA_HIGH_FPS_MODE: ${CAMERA_HIGH_FPS_MODE:-true}
      CAMERA_HEARTBEAT_SECONDS: ${CAMERA_HEARTBEAT_SECONDS:-5}
    volumes:
    - model-data:/models
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  training-worker:
    build: ./services/training_worker
    # Always-on: reports CPU/GPU availability through /health and accepts jobs
    # whenever an operator starts training.
    environment:
      ZMK_API_URL: http://api:8000
      ZMK_API_KEY: ${ZMK_API_KEY:-}
      TRAINING_DATA_DIR: /data
      MODEL_DIR: /models
      DATASET_DIR: /datasets
      TRAINING_DEVICE: ${TRAINING_DEVICE:-auto}
    volumes:
    - training-data:/data
    - model-data:/models
    - dataset-data:/datasets
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8010/health')
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  updater:
    build: ./services/updater
    volumes:
    - .:/workspace
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
      UPDATE_ROOT: /workspace
      ZMK_UPDATE_TOKEN: ${ZMK_UPDATE_TOKEN:-}
      ZMK_UPDATE_REPO: ${ZMK_UPDATE_REPO:-danilka-revin/zmk-videoanalytics}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8020/health')
      interval: 15s
      timeout: 3s
      retries: 3
  redis:
    image: redis:7-alpine
    profiles:
    - production
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    profiles:
    - production
    environment:
      POSTGRES_DB: videoanalytics
      POSTGRES_USER: zmk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-before-production}
    volumes:
    - postgres-data:/var/lib/postgresql/data
  minio:
    image: minio/minio
    profiles:
    - production
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zmkadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-before-production}
    volumes:
    - minio-data:/data
volumes:
  postgres-data: {}
  minio-data: {}
  training-data: {}
  model-data: {}
  dataset-data: {}
  bot-token-data: {}
