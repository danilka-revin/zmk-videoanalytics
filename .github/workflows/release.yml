name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows-installer-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse and dry-check PowerShell installer
        shell: pwsh
        run: ./installers/install-windows.ps1 -CheckOnly
  verify-and-release:
    needs: windows-installer-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements-dev.txt -r services/telegram_bot/requirements.txt -r services/max_bot/requirements.txt
      - run: pip-audit -r backend/requirements.txt -r services/telegram_bot/requirements.txt -r services/max_bot/requirements.txt
      - run: ruff check backend services tests
      - run: bandit -r backend/app services -x services/telegram_bot/test_helpers.py,services/max_bot/test_helpers.py -q
      - run: PYTHONPATH=backend pytest backend/tests -q
      - run: PYTHONPATH=services/telegram_bot pytest services/telegram_bot/test_helpers.py -q
      - run: PYTHONPATH=services/max_bot pytest services/max_bot/test_helpers.py -q
      - run: pytest tests -q
      - uses: actions/setup-node@v5
        with: {node-version: '24'}
      - run: npm ci && npm audit --omit=dev --audit-level=high && npm run lint && npm run build
        working-directory: frontend
      - name: Validate Compose and build all application images
        run: docker compose --profile telegram --profile max --profile training --profile inference config --quiet && docker compose --profile telegram --profile max --profile training --profile inference build
      - name: Build release archives
        run: |
          mkdir -p release-stage/zmk-videoanalytics
          tar --exclude='./.git' --exclude='*/node_modules' --exclude='*/dist' --exclude='*.db' --exclude='./release-stage' --exclude='zmk-videoanalytics-*.zip' --exclude='zmk-videoanalytics-*.tar.gz' -cf - . | tar -xf - -C release-stage/zmk-videoanalytics
          cd release-stage
          zip -qr ../zmk-videoanalytics-${GITHUB_REF_NAME}.zip zmk-videoanalytics
          tar -czf ../zmk-videoanalytics-${GITHUB_REF_NAME}.tar.gz zmk-videoanalytics
          cd ..
          sha256sum zmk-videoanalytics-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            zmk-videoanalytics-*.zip
            zmk-videoanalytics-*.tar.gz
            SHA256SUMS.txt
            installers/install-windows.ps1
            installers/install-windows.bat
            installers/install-linux.sh
