name: CI
on: [push, pull_request]
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse and dry-check PowerShell installer
        shell: pwsh
        run: ./installers/install-windows.ps1 -CheckOnly
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements-dev.txt
      - run: pip install -r services/telegram_bot/requirements.txt -r services/max_bot/requirements.txt
      - run: pip-audit -r backend/requirements.txt -r services/telegram_bot/requirements.txt -r services/max_bot/requirements.txt -r services/updater/requirements.txt
      - run: ruff check backend services tests
      - run: bandit -r backend/app services -x services/telegram_bot/test_helpers.py,services/max_bot/test_helpers.py -q
      - run: PYTHONPATH=backend pytest backend/tests -q
      - run: PYTHONPATH=services/telegram_bot pytest services/telegram_bot/test_helpers.py -q
      - run: PYTHONPATH=services/max_bot pytest services/max_bot/test_helpers.py -q
      - run: pytest tests -q
      - name: Shell scripts syntax + installer dry check
        run: |
          bash -n installers/*.sh installers/auto-update.sh start.sh
          bash installers/install-linux.sh --check
      - uses: actions/setup-node@v5
        with: {node-version: '24'}
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Validate Compose and build all application images
        run: docker compose --profile telegram --profile max --profile training --profile inference config --quiet && docker compose --profile telegram --profile max --profile training --profile inference build
